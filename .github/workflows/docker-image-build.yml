name: Build Docker image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-image-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the released package, build and test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 deploy/registry/build-image.py --output "$RUNNER_TEMP/blankbox-image"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blankbox-docker-image
          path: |
            ${{ runner.temp }}/blankbox-image/image.tar.gz
            ${{ runner.temp }}/blankbox-image/image-build.json
          if-no-files-found: error
          retention-days: 30
